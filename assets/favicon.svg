<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Olamide Olaitan OO neural network favicon</title>
  <desc id="desc">Two linked infinity loops in mint and coral, with minimal neural network nodes inside each loop.</desc>
  <defs>
    <linearGradient id="loopGradient" x1="11" y1="30" x2="117" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20EDBD"/>
      <stop offset="0.47" stop-color="#67EBC2"/>
      <stop offset="0.66" stop-color="#B9F2C6"/>
      <stop offset="1" stop-color="#FFAD81"/>
    </linearGradient>
    <linearGradient id="nodesGradient" x1="28" y1="51" x2="102" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65F7D5"/>
      <stop offset="0.55" stop-color="#8CEED5"/>
      <stop offset="1" stop-color="#FFBC92"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="27" fill="#0C1218"/>
  <!-- The network is deliberately sparse, so the mark reads clearly at small sizes. -->
  <g fill="none" stroke="#58E8C6" stroke-width="1.25" stroke-linecap="round" stroke-opacity=".82">
    <path d="M26 58 39 52 51 64 39 76 26 70M26 58 39 76M26 70 39 52M39 52 51 64M39 76 51 64"/>
  </g>
  <g fill="none" stroke="#FFBF98" stroke-width="1.25" stroke-linecap="round" stroke-opacity=".82">
    <path d="M77 64 90 52 103 58M77 64 90 76 103 70M90 52 103 70M90 76 103 58M90 52 90 76"/>
  </g>
  <g fill="url(#nodesGradient)">
    <circle cx="26" cy="58" r="2.5"/><circle cx="26" cy="70" r="2.5"/>
    <circle cx="39" cy="52" r="2.5"/><circle cx="39" cy="76" r="2.5"/>
    <circle cx="51" cy="64" r="2.5"/>
    <circle cx="77" cy="64" r="2.5"/>
    <circle cx="90" cy="52" r="2.5"/><circle cx="90" cy="76" r="2.5"/>
    <circle cx="103" cy="58" r="2.5"/><circle cx="103" cy="70" r="2.5"/>
  </g>
  <!-- OO/infinity outline: two continuously flowing rounded loops -->
  <path d="M64 64 C52 43 43 35 30 39 C10 44 10 84 30 89 C45 93 53 80 64 64 C75 48 83 35 98 39 C118 44 118 84 98 89 C83 93 75 80 64 64" 
        fill="none" stroke="url(#loopGradient)" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crossing accent establishes over-under depth without crowding the neural motif. -->
  <path d="M58 73 C60 70 62 67 64 64 C68 59 71 54 74 51" 
        fill="none" stroke="#A4F3D2" stroke-width="11.5" stroke-linecap="round" opacity=".96"/>
</svg>
